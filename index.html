<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>雀荘経営 プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ede8; --panel:#ffffff; --panel2:#f2f6f3; --ink:#13241c; --sub:#55665d;
  --line:#cfdad3; --accent:#1e7a57; --accent-ink:#ffffff; --gold:#b87712; --stage:#1b2230;
  --disabled:#b9c4be;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1712; --panel:#16241d; --panel2:#1c2d25; --ink:#e4eee8; --sub:#9db2a7;
    --line:#284035; --accent:#3fb382; --accent-ink:#06140e; --gold:#ffb52e; --stage:#0a0f16;
    --disabled:#3a4d44;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1712; --panel:#16241d; --panel2:#1c2d25; --ink:#e4eee8; --sub:#9db2a7;
  --line:#284035; --accent:#3fb382; --accent-ink:#06140e; --gold:#ffb52e; --stage:#0a0f16;
  --disabled:#3a4d44;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 14px 8px}
.shop{font-size:13px;color:var(--sub);font-weight:700}
.money{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:30px;line-height:1.05;letter-spacing:.01em}
.rate{font-size:13px;color:var(--sub);margin-top:2px}
#rushBtn{border:0;border-radius:999px;padding:10px 14px;font:inherit;font-weight:700;font-size:13px;
  background:var(--gold);color:#1b1206;cursor:pointer;min-height:44px;white-space:nowrap}
#rushBtn.on{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--stage);position:relative;overflow:hidden}
canvas{display:block;touch-action:manipulation}
#sheet{flex:0 0 auto;height:36%;min-height:210px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--sub);padding:12px 0;cursor:pointer;border-bottom:3px solid transparent;min-height:44px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#list{flex:1;overflow-y:auto;padding:6px 12px 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--sub);margin-top:3px}
.stats i{font-style:normal;color:var(--gold);margin-left:3px;letter-spacing:-1px}
.cand{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}
.cand b{font-size:15px}
.cand:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nm small.sst{color:var(--accent)}
.mcard{max-height:92vh;overflow-y:auto}
.xp{display:inline-block;width:22px;height:4px;background:var(--line);border-radius:2px;margin-left:4px;overflow:hidden;vertical-align:middle}
.xp b{display:block;height:100%;background:var(--accent)}
.btns{display:flex;flex-direction:column;gap:6px}
.cand:disabled{opacity:.5;cursor:default}
.cand .dots{font-style:normal;color:var(--gold);margin-left:6px}
.cand .tc{float:right;font-weight:700}
.lk{opacity:.22}
#goal{display:flex;align-items:center;gap:6px 10px;padding:0 14px 8px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
#goal span{flex:1 1 auto}
#goal i{display:block;flex:1 0 100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
#goal i b{display:block;height:100%;background:var(--gold)}
#goal.done{color:var(--ink);font-weight:700}
#goal button{border:0;border-radius:999px;background:var(--gold);color:#1b1206;font:inherit;font-weight:700;padding:8px 16px;min-height:40px;cursor:pointer}
#goal button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#timebar{display:flex;align-items:center;gap:10px;padding:0 14px 8px}
.tb-track{position:relative;flex:1;display:flex;height:18px;border-radius:9px;overflow:hidden}
.tb-band{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#3a2a10}
.tb-band.night{color:#e8ecff}
#tbPast{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(20,20,30,.38)}
#tbMark{position:absolute;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 1.5px #1b1206;border-radius:2px}
#map{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;background:#9fc3d6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#map.show{display:flex}
.map-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(10,30,50,.55);color:#fff}
.map-title{font-family:"Dela Gothic One",sans-serif;font-size:20px}
.map-sub{font-size:12.5px;opacity:.85;margin-top:2px}
#mapClose{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:8px 14px;min-height:40px;font:inherit;font-weight:700;cursor:pointer}
.map-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#mapSvg{width:100%;height:100%;max-width:560px}
#mapSvg .pin{cursor:pointer}
#mapSvg .pin:focus-visible{outline:none}
#mapSvg .pin:focus-visible circle.ring{stroke:#fff;stroke-width:3}
.map-panel{background:var(--panel);color:var(--ink);padding:14px 16px 16px;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
.map-panel h3{margin:0;font-size:17px}
.map-panel .mp-sub{font-size:13px;color:var(--sub);margin:2px 0 10px}
.map-panel .mp-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-bottom:12px}
.map-panel .mp-grid span{color:var(--sub)}
.map-panel .mbtn{margin-top:6px}
@keyframes pinPulse{0%{r:9;opacity:.9}100%{r:22;opacity:0}}
#mapSvg .pulse{animation:pinPulse 1.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){#mapSvg .pulse{animation:none}}

/* ===== スマホ縦画面向けレイアウト ===== */
html,body{height:100%;height:100dvh}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{touch-action:manipulation} /* touch-actionは継承されないので全要素でダブルタップズームを止める */
#app{height:100%;max-width:560px}
header{display:block;padding:8px 14px 6px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.money{font-size:28px;line-height:1.1}
#rushBtn{min-height:44px;padding:0 16px;font-size:14px}
.hd-sub{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap}
.hd-sub .shop,.hd-sub .rate{font-size:12.5px;margin:0;overflow:hidden;text-overflow:ellipsis}
#timebar{padding:2px 14px 6px}
.tb-track{height:20px;border-radius:10px}
#goal{padding:0 14px 8px;font-size:12px;gap:4px 10px;flex-wrap:nowrap}
#goal span{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal i{flex:1 1 40px;min-width:40px;height:6px}
#goal.done{flex-wrap:wrap}
#goal.done span{white-space:normal}
#goal button{min-height:44px;padding:0 18px;font-size:14px}
#sheet{height:auto;min-height:0;flex:0 0 auto;border-top:0;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18);position:relative;z-index:2}
#sheet #list{flex:0 0 auto;height:30vh;height:30dvh;max-height:340px;overscroll-behavior:contain}
#sheet.collapsed #list{display:none}
#sheetToggle,#sheet nav{touch-action:none} /* 取っ手とタブ列はドラッグで開閉 */
#sheetToggle{display:flex;align-items:center;justify-content:center;width:100%;height:22px;border:0;background:none;cursor:pointer;padding:0}
#sheetToggle span{width:40px;height:5px;border-radius:3px;background:var(--line)}
nav{border-bottom:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 0 6px;font-size:11px;border-bottom-width:3px}
nav button svg{display:block}
#stage{min-height:0}
.row{padding:10px 2px;min-height:60px}
.nm{font-size:15px}
.ds{font-size:12.5px;line-height:1.45}
.buy{min-width:96px;min-height:48px;font-size:15px}
.alt{min-height:48px;min-width:72px}
.mbtn{min-height:52px;font-size:16px}
.mcard{padding:22px 18px}
#mapClose{min-height:44px;padding:0 16px}
#bonus{min-height:48px;font-size:14px;max-width:calc(100% - 24px);white-space:normal}
#toast{max-width:calc(100% - 24px);white-space:normal;text-align:center;font-size:13px}
@media (max-height:700px){.money{font-size:24px}header{padding-top:6px}.hd-sub{font-size:12px}#sheet #list{height:26vh;height:26dvh}}
.hd-btns{display:flex;align-items:center;gap:8px}
#mapOpen{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--panel2);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
#mapOpen:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#bossName{width:100%;min-height:48px;font:inherit;font-size:17px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);-webkit-user-select:text;user-select:text;margin-top:4px}
#bossName:focus{outline:3px solid var(--gold);outline-offset:1px}
.nm-hint{font-size:12px!important;margin:6px 0 4px!important;text-align:left}
#cv{image-rendering:pixelated}
#openOv{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(8,10,20,.55)}
#openOv.show{display:flex}
.oo-card{position:relative;background:var(--panel);color:var(--ink);border-radius:18px;padding:30px 22px 20px;width:min(86%,340px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden}
.oo-ribbon{position:absolute;left:0;right:0;top:12px;height:8px;background:linear-gradient(90deg,#c0392b,#e74c3c,#c0392b)}
.oo-place{font-size:13px;color:var(--sub);margin-top:8px}
.oo-name{font-family:"DotGothic16","Dela Gothic One",sans-serif;font-size:28px;margin:6px 0 8px;line-height:1.2}
.oo-card p{font-size:13px;color:var(--sub);margin:0 0 16px}
#ooBtn{width:100%;min-height:56px;border:0;border-radius:14px;background:linear-gradient(#e0473a,#b8231a);color:#fff;font:inherit;font-weight:700;font-size:20px;letter-spacing:.2em;cursor:pointer;box-shadow:0 4px 0 #7a130c}
#ooBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a130c}
#ooBtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#shopNameIn{width:100%;min-height:48px;font:inherit;font-size:17px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);-webkit-user-select:text;user-select:text;margin-top:4px}
#shopNameIn:focus{outline:3px solid var(--gold);outline-offset:1px}
#story{position:absolute;left:8px;right:8px;bottom:8px;z-index:9;display:none;gap:10px;align-items:flex-start;padding:12px 12px 22px;border-radius:14px;
  background:rgba(18,20,30,.94);color:#f4f1e8;border:2px solid #c8a04a;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;min-height:96px}
#story.show{display:flex}
#stFace{width:56px;height:56px;flex:none;image-rendering:pixelated;border-radius:6px;border:2px solid #c8a04a;background:#ddd}
.st-body{flex:1;min-width:0}
#stName{font-family:"DotGothic16",sans-serif;font-size:13px;color:#ffd35a;margin-bottom:4px}
#stText{font-family:"DotGothic16","Zen Kaku Gothic New",sans-serif;font-size:15px;line-height:1.6}
#stText.narr{font-style:normal;color:#dfe3ea}
#stSkip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;min-height:40px;padding:0 16px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.8);background:rgba(20,20,30,.6);color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
body.story .hd-btns{visibility:hidden} /* 会話中は右上をスキップボタンに譲る */
#stNext{position:absolute;right:12px;bottom:4px;font-size:12px;color:#ffd35a;animation:stBlink 1s infinite}
@keyframes stBlink{50%{opacity:.2}}
.row.two{grid-template-columns:1fr auto auto}
.alt{border:1.5px solid var(--accent);border-radius:10px;min-height:44px;min-width:64px;padding:6px 10px;font:inherit;font-weight:700;font-size:13px;background:transparent;color:var(--accent);cursor:pointer}
.alt.set{background:var(--gold);border-color:var(--gold);color:#1b1206}
.hearts{color:#e0506a;font-size:12px;letter-spacing:1px}
.visits{font-size:12.5px;color:var(--sub);text-align:right;white-space:nowrap}
#day{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:7;background:rgba(5,8,20,.72);color:#fff;text-align:center}
#day.show{display:flex}
#day h3{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:26px;margin:0 0 12px}
#day p{margin:4px 0;font-size:15px}
#day b{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:#ffd35a}
nav button{font-size:12.5px}
.row:last-child{border-bottom:0}
.nm{font-weight:700;font-size:15px}
.nm small{font-weight:500;color:var(--sub);margin-left:6px;font-size:12px}
.ds{font-size:12.5px;color:var(--sub);margin-top:2px}
.buy{border:0;border-radius:10px;min-width:92px;min-height:44px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
.buy:disabled{background:var(--disabled);color:var(--panel);cursor:default}
.buy:focus-visible,#rushBtn:focus-visible,nav button:focus-visible,.mbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stat{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.stat b{font-family:"Dela Gothic One",sans-serif;font-weight:400}
.note{font-size:12.5px;color:var(--sub);padding:10px 2px;line-height:1.6}
/* 役満 */
#yk{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
#yk.show{display:flex}
#yk .box{text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
#yk .big{font-family:"Dela Gothic One",sans-serif;font-size:64px;color:#ffd35a;
  text-shadow:0 0 18px rgba(255,190,40,.9),0 4px 0 #7a1f2e,0 6px 18px rgba(0,0,0,.6);line-height:1}
#yk .yn{font-family:"Dela Gothic One",sans-serif;font-size:26px;color:#fff;margin-top:8px;text-shadow:0 2px 8px #000}
#yk .yb{font-weight:700;font-size:18px;color:#ffd35a;margin-top:6px;text-shadow:0 2px 6px #000}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
#bonus{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;display:none;
  border:0;border-radius:999px;background:var(--gold);color:#1b1206;font:inherit;font-weight:700;font-size:14px;padding:12px 18px;min-height:44px;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.4)}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.75);color:#fff;
  font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
/* モーダル */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal.show{display:flex}
.mcard{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px 20px;width:100%;max-width:340px;text-align:center}
.mcard h2{margin:0 0 6px;font-size:17px}
.mcard .mv{font-family:"Dela Gothic One",sans-serif;font-size:34px;margin:8px 0 16px;color:var(--gold)}
.mcard p{margin:0 0 14px;font-size:14px;color:var(--sub);line-height:1.6}
.mbtn{display:block;width:100%;border:0;border-radius:12px;min-height:48px;font:inherit;font-weight:700;font-size:15px;margin-top:8px;cursor:pointer}
.mbtn.pri{background:var(--gold);color:#1b1206}
.mbtn.sec{background:var(--panel2);color:var(--ink)}
.mbtn:disabled{opacity:.45;cursor:default}
.count{font-family:"Dela Gothic One",sans-serif;font-size:48px;color:var(--gold);margin:6px 0}
@media (prefers-reduced-motion: reduce){#yk .box{animation:none}}
/* 開業前(1号店の町を選ぶまで)は店内の代わりにプロローグの画面を出す */
body.pre header,body.pre #timebar,body.pre #goal,body.pre #sheet{display:none}
#intro{position:absolute;inset:0;z-index:7;display:none;overflow:hidden;background:#fbe3cf}
body.pre #intro{display:block}
body.pre #toast{z-index:8}
#intro>.in-bg{position:absolute;inset:0;width:100%;height:100%}
.in-title{position:absolute;left:0;right:0;top:9%;text-align:center;color:#5a3421;padding:0 16px}
.in-title small{display:block;font-size:12px;font-weight:700;letter-spacing:.3em;opacity:.75}
.in-title h1{margin:6px 0 0;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(26px,8vw,36px);line-height:1.25;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.in-letter{position:absolute;left:50%;top:31%;width:min(46vw,200px);transform:translateX(-50%) rotate(-4deg);filter:drop-shadow(0 8px 14px rgba(90,52,33,.28));animation:inFloat 4s ease-in-out infinite}
@keyframes inFloat{50%{transform:translateX(-50%) translateY(-8px) rotate(-2deg)}}
#inGo{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);min-height:48px;padding:0 26px;border:0;border-radius:999px;
  background:#c0392b;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(90,20,10,.35);white-space:nowrap}
#intro.talk #inGo{display:none}
.petal{position:absolute;top:-16px;width:10px;height:8px;border-radius:10px 1px 10px 1px;background:#f6b6c8;opacity:.9;pointer-events:none;animation:petal linear infinite}
@keyframes petal{to{transform:translate(-60px,110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){.in-letter,.petal{animation:none}.petal{display:none}}
/* チュートリアル:操作する場所を光る枠で示す(枠はタップを通す) */
#coachRing{position:fixed;z-index:8;display:none;border:3px solid #ffd35a;border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(0,0,0,.35),0 0 16px 2px rgba(255,211,90,.9);animation:coachPulse 1.2s ease-in-out infinite}
@keyframes coachPulse{50%{border-color:#fff}}
#coachTip{position:fixed;z-index:8;display:none;left:16px;right:16px;max-width:360px;margin:0 auto;padding:12px 14px 10px;border-radius:14px;
  background:#fffaf0;color:#3a2414;border:2px solid #c8a04a;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px;line-height:1.6}
#coachTip .ct-h{font-size:11.5px;font-weight:700;color:#a0701a;letter-spacing:.05em}
#coachTip .ct-b{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#coachTip .ct-b:empty{display:none}
body.tut .hd-btns{visibility:hidden} /* チュートリアル中は右上をスキップボタンに譲る */

// サイドテーブルに器が残っている席には案内しない(片づけてから)
const seatFree=(t,k)=>t.seats[k]===null&&!t.side[k].length;
const freeIdx=t=>[0,1,2,3].find(k=>seatFree(t,k))??-1;
// 客から見て左側のサイドテーブルの位置
function sidePos(tb,k){const s=SLOTS[tb.slot],sx=s.x+OFF[k][0],sy=s.y+OFF[k][1],L=Math.hypot(s.x-sx,s.y-sy),fx=(s.x-sx)/L,fy=(s.y-sy)/L;return{x:sx+fy*SIDE_GAP,y:sy-fx*SIDE_GAP};}
const SIDE_GAP=29; // 客とサイドテーブルの間隔
function openTable(e){let o=tables.filter(t=>!t.broken&&S.modes[t.slot]==='free'&&t.state==='open'&&freeIdx(t)>=0);
  const pref=e&&e.ctype?CT[e.ctype].tier:1;
  if(e&&e.reg!=null&&REG[e.reg].tierMin){const hi=o.filter(t=>tierOf(t)>=REG[e.reg].tierMin);if(hi.length)o=hi;}
  const sc=t=>occ(t)*10+tierOf(t)*pref-(t.dirt>.5?12:0);o.sort((a,b)=>sc(b)-sc(a));return o[0]||null;}
function mkCust(type,reg){const T=CT[type],R=reg!=null?REG[reg]:null;
  const side=Math.random()<.5;const e={id:nid++,type:'cust',outside:1,ctype:type,reg,x:side?-16:W+16,y:SW+rnd(-5,5),corr:CY,path:[],moving:false,state:'new',dir:-Math.PI/2,
    body:R?R.body:pick(T.body),hair:R?R.hair:pick(T.hair),sitSince:0,wseat:null};
  if(R){e.bubble='どうも';e.bubbleT=2.5;}
  return e;}
const STLABEL={spd:'移動',cook:'調理',charm:'愛嬌',mj:'麻雀',sta:'体力'};
const xpNeed=lv=>12*lv*lv;
function gainXp(e,k,n){const st=e&&e.st;if(!st||st[k]>=capOf(st,k))return;st.xp=st.xp||{};st.xp[k]=(st.xp[k]||0)+n;
  if(st.xp[k]>=xpNeed(st[k])){st.xp[k]-=xpNeed(st[k]);st[k]++;if(st[k]>=capOf(st,k))st.xp[k]=0;
    floats.push({x:e.x,y:e.y-18,text:STLABEL[k]+'UP!',t:0,c:'#7fffb0',small:1});burst(e.x,e.y,12,['#7fffb0','#ffffff']);
    toast(`${st.name}さんの${STLABEL[k]}が${st[k]}に上がりました`);}}
const trainCost=(st,k)=>pr(800*Math.pow(2.4,st[k]-1));
const STAFF_SPEED=1.5; // スタッフ(メンバー・ホール)の移動速度の倍率
// スタミナ:仕事をするたびに減り、0になったら休憩室で休む(体力のステータスが高いほど多い)
const stamMax=st=>8+4*(st.sta||1);
function useStam(e,n){const st=e&&e.st;if(!st||e.type==='boss')return;if(st.stam==null)st.stam=stamMax(st);st.stam=Math.max(0,st.stam-n);}
const tired=e=>e.st&&e.st.stam!=null&&e.st.stam<=0;
const spdMul=e=>e.st?(0.7+0.12*e.st.spd)*STAFF_SPEED:1;
const cookMul=e=>e.st?1.3-0.12*e.st.cook:1;
const custPat=e=>CT[e.ctype].pat+(e.reg!=null?hearts(S.regs[e.reg])*10:0);
function spawn(){
  const type=pickType(HOURS[hourNow()][1]);
  if(Math.random()<CT[type].set&&S.modes.includes('set')){
    const tb=tables.find(t=>!t.broken&&S.modes[t.slot]==='set'&&t.state==='open'&&occ(t)===0&&t.side.every(x=>!x.length));
    if(tb){for(let i=0;i<4;i++){const e=mkCust(type,null);e.x=-16-i*16;e.y=SW;e.set=true;ents.push(e);sendToSeat(e,tb,i);}
      tb.setStart=S.clock;tb.setUntil=S.clock+rnd(120,240);S.visits+=4;S.dayVisits+=4;
      floats.push({x:AISLE,y:HI-30,text:'セット4名様',t:0,c:'#ffd35a',small:1});return;}
    S.lost+=4;addRep(-.005);floats.push({x:AISLE,y:HI-30,text:'セット卓が埋まっています',t:0,c:'#ffffff',small:1});return;
  }
  let reg=null;const cand=[];REG.forEach((r,i)=>{if(r.type===type&&S.visits>=r.need&&!ents.some(e=>e.reg===i))cand.push(i);});
  if(cand.length&&Math.random()<.22)reg=pick(cand);
  const e=mkCust(type,reg);
  const tb=openTable(e);
  const prev=S.visits;
  const ok=()=>{S.visits++;S.dayVisits++;REG.forEach(r=>{if(prev<r.need&&S.visits>=r.need)toast('新しい常連 '+r.name+'が来るようになりました');});};
  if(tb){ents.push(e);sendToSeat(e,tb,freeIdx(tb));ok();return;}
  if(S.wait){const w=waitSeats.indexOf(null);if(w>=0){ents.push(e);sendToWait(e,w);ok();return;}}
  S.lost++;addRep(-.005);floats.push({x:AISLE,y:HI-30,text:S.wait?'待合室も満席…':'満席…',t:0,c:'#ffffff'});
}
function arrive(e){
  if(e.state==='toSeat'){e.state='seated';e.sitSince=gt;const s=SLOTS[e.table.slot];e.dir=Math.atan2(s.y-e.y,s.x-e.x);if(e.type==='cust'){const first=e.plan==null;if(first){e.games=0;e.plan=planGames(e.ctype);}
      // 通い慣れた常連は、席に着くと「いつもの!」で必ず注文する
      if(first&&e.reg!=null&&S.regs[e.reg]>=3&&(S.drink||S.food)){e.bubble='いつもの!';e.bubbleT=2.5;placeOrder(e,S.drink?'drink':'food');rollOrders(e,.5);}
      else rollOrders(e,1);}}
  else if(e.state==='toWait'){e.state='waiting';e.sitSince=gt;e.dir=-Math.PI/2;}
  else if(e.state==='toStand'){e.state='standby';e.dir=0;}
  else if(e.state==='leaving'){ents=ents.filter(x=>x!==e);}
  else if(e.state==='returning'){e.state='idle';e.dir=Math.PI/2;e.carry=null;}
  else if(e.state==='toClean'){if(e.cleanTb.state==='play'){e.cleanTb.cleaner=null;goHome(e);}else{e.state='cleaning';e.timer=S.broom?1.5:3;e.dir=Math.PI/2;}}
  else if(e.state==='toRepair'){e.state='repairing';e.timer=12;e.dir=Math.PI/2;}
  else if(e.state==='toRest'){e.state='resting';e.dir=-Math.PI/2;}
  else if(e.state==='toBus'){e.state='busing';const tb=e.bus.tb,n=[0,1,2,3].filter(k=>tb.seats[k]===null&&tb.side[k].length).length;e.timer=.6+.3*n;}
  else if(e.state==='toKitchen'){e.state='cook';e.timer=2.2*cookMul(e);e.dir=Math.PI/2;}
  else if(e.state==='deliver'){const c=byId(e.job.id);
    if(canServe(c,e.job)){const st=e.st||{cook:3,charm:3};const v=e.job.k==='food'?Math.round(foodPrice()*(0.9+0.05*st.cook)):drinkPrice();S.served++;
      earn(v,c.x,c.y-14,'#9fe8ff',e.job.icon);const w=gt-(e.job.at||gt);addRep((w<15?.01:0)+0.002*(st.charm-3));
      gainXp(e,'charm',2);useStam(e,1);if(Math.random()<0.04*st.charm)setTimeout(()=>earn(Math.round(v*0.5),c.x,c.y-28,'#ffb3c7','💝'),350);if(e.job.k==='food')e.job.tb.dirt=Math.min(1,e.job.tb.dirt+.04);c.orders=(c.orders||[]).filter(x=>x!==e.job);const sd=c.table.side[c.seat];sd.push(e.job.icon);if(sd.length>2)sd.shift();}
    serverHome(e);}
}
function move(e,dt){
  let d=SPEED*spdMul(e)*dt;
  while(d>0&&e.path.length){const p=e.path[0],dx=p.x-e.x,dy=p.y-e.y,L=Math.hypot(dx,dy);
    const step=Math.min(L,d);if(e.st){e.walk=(e.walk||0)+step;if(e.walk>=300){e.walk-=300;gainXp(e,'spd',1);}}
    if(L<=d){e.x=p.x;e.y=p.y;e.path.shift();d-=L;}else{e.x+=dx/L*d;e.y+=dy/L*d;e.dir=Math.atan2(dy,dx);d=0;}}
  if(e.moving&&!e.path.length){e.moving=false;arrive(e);}
}
function earn(v,x,y,c,icon){if(v<=0)return;S.money+=v;S.total+=v;S.dayEarn+=v;S.storeEarn+=v;incomeLog.push({t:Date.now(),v});floats.push({x,y,text:(icon||'')+'+¥'+fmt(v),t:0,c:c||'#ffe08a'});}
function burst(x,y,n,cols){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*120;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.6+Math.random()*.7,max:1.3,c:cols[i%cols.length],s:1.5+Math.random()*2.5});}}

// 注文は席に着いたときに入れる(実際の雀荘と同じ)。居残った客は半荘の始めに追加注文することがある
// フリー客が1回の来店で打つ半荘数。平均3半荘(シニアは長め、会社員は短め)
const PLAN_MEAN={s:3.8,w:2.8,g:3.3}; // 閉店で打ち切られる分を見込んで、実際の平均が約3半荘になるように
function planGames(t){return Math.max(1,Math.round(PLAN_MEAN[t]+(rnd(-1.6,1.6)+rnd(-1.6,1.6))/2));}
function placeOrder(c,k){c.orders=c.orders||[];if(c.orders.some(o=>o.k===k))return;const T=CT[c.ctype];
  const o={tb:c.table,id:c.id,k,icon:k==='food'?T.fi:T.di,at:gt};c.orders.push(o);orders.push(o);}
function rollOrders(c,m){if(c.type!=='cust'||!c.table)return;const T=CT[c.ctype];
  if(S.drink&&Math.random()<T.dr*m)placeOrder(c,'drink');if(S.food&&Math.random()<T.fd*m)placeOrder(c,'food');}
function startGame(tb){
  tb.state='play';tb.t=0;tb.pend=[];let f=1;tb.seats.map(byId).forEach(m=>{if(isCrew(m))f*=1-0.04*(m.st.mj-1);});
  tb.dur=TIERS[tierOf(tb)].dur*f;const dur=tb.dur;
  tb.seats.map(byId).forEach(c=>{if(c&&c.type==='cust'&&c.games>0&&!(c.orders||[]).length)rollOrders(c,.25);});
}
// 頼んだものがまだ届いていない客は、受け取ってから帰る(最大15秒待つ)
// 帰る客は、まだ届いていない注文をキャンセルしてそのまま帰る
function leaveOrWait(e){leave(e);}
const canServe=(c,o)=>c&&(c.orders||[]).includes(o)&&c.table===o.tb&&c.state==='seated';
function endGame(tb){
  const s=SLOTS[tb.slot];S.games++;tb.state='open';tb.t=0;tb.pend=[];addRep(tb.dirt>.5?-.01:.005);
  tb.dirt=Math.min(1,tb.dirt+(S.modes[tb.slot]==='set'?.04:.08));
  if(Math.random()<TIERS[tierOf(tb)].yk)yakuman(tb);
  const list=tb.seats.map(byId).filter(Boolean);
  const brk=!tb.manual&&S.tiers[tb.slot]>=1&&Math.random()<(S.tiers[tb.slot]===1?.04:.025)*(S.maint?.5:1);
  if(S.modes[tb.slot]==='set'){
    const done=S.clock>=tb.setUntil||S.closing||brk;
    if(done){const hrs=Math.max(1,(S.clock-tb.setStart)/60);earn(Math.round(setRate(tb)*hrs),s.x,s.y-8,'#ffe08a');list.forEach(e=>leaveOrWait(e));}
    else list.forEach(e=>{e.sitSince=gt;e.games=(e.games||0)+1;});
    tb.waitSince=gt;if(brk)breakTable(tb);return;
  }
  let sum=0;const per=feePer(tb);
  list.forEach(e=>{if(e.type!=='cust')return;let f=per;if(e.reg!=null){f=Math.round(per*(1+0.1*hearts(S.regs[e.reg])));S.regs[e.reg]++;addRep(.01);}sum+=f;});
  let charmB=0;list.forEach(m=>{if(isCrew(m)){charmB+=0.03*m.st.charm;addRep(0.002*(m.st.mj-2));gainXp(m,'mj',3);gainXp(m,'charm',1);useStam(m,2);}});
  earn(sum,s.x,s.y-8);
  if(brk){list.forEach(e=>{e.orders=[];if(isCrew(e)){goHome(e);return;}if(S.closing){leave(e);return;}
      freeSeat(e);const t2=openTable(e);if(t2&&t2!==tb){sendToSeat(e,t2,freeIdx(t2));return;}
      if(e.type==='cust'&&S.wait){const w=waitSeats.indexOf(null);if(w>=0){sendToWait(e,w);return;}}
      leave(e,e.type==='pro'?'またね':'💦');});
    tb.waitSince=gt;breakTable(tb);return;}
  list.forEach(e=>{
    if(isCrew(e))goHome(e);
    else if(e.type==='pro'){if(proOn()&&!S.closing)e.sitSince=gt;else leave(e,'またね');}
    else{e.games=(e.games||0)+1;
      // 予定の半荘数まで打つ。予定に達しても、メンバーの愛嬌しだいで「もう1半荘だけ」打つことがある(1回まで)
      const more=e.games<(e.plan||1)||(!e.extra&&Math.random()<charmB&&(e.extra=1));
      if(!S.closing&&more)e.sitSince=gt;else leaveOrWait(e);}});
  tb.waitSince=gt;
}

function openStoreMenu(){const n=STAGES[S.shops.length];if(!n)return;const oc=n.open,short=S.money<oc;

function switchShop(i,quiet){if(i===S.active||!S.shops[i])return;
  S.tb=tables.map(t=>({d:+t.dirt.toFixed(2),b:t.broken?1:0,m:t.manual?1:0}));S.shops[S.active]=snapShop(S);

function newStore(){if(!isNewest()||S.shops.length>=STAGES.length)return;const oc=STAGES[S.shops.length].open;if(S.money<oc)return;S.money-=oc;
  S.shops.push(freshShop(S.shops.length,S));switchShop(S.shops.length-1,true);prepareOpening();}

// ---------- 閉店 ----------
let closeT=0,dayCardT=0;
function closing(dt){
  closeT+=dt;
  ents.forEach(e=>{if(e.type==='cust'&&e.state!=='leaving'&&!(e.table&&e.table.state==='play'))leave(e);
    if(e.type==='pro'&&e.state!=='leaving'&&!(e.table&&e.table.state==='play'))leave(e);});
  if(closeT>40)tables.forEach(tb=>{if(tb.state==='play')tb.t=1e9;});
  if(!ents.some(e=>e.type==='cust'||e.type==='pro'))endDay();
}
function endDay(){
  document.getElementById('dayT').textContent=S.day+'日目 営業終了';
  document.getElementById('dayE').textContent='¥'+fmt(S.dayEarn);
  document.getElementById('dayV').textContent=S.dayVisits+'人';
  document.getElementById('dayR').textContent='★'+S.rep.toFixed(1);
  document.getElementById('day').classList.add('show');dayCardT=5;S.closing=2;
  ents.forEach(e=>{if(e.st)e.st.stam=stamMax(e.st);});tables.forEach(t=>{t.dirt=0;t.cleaner=null;t.side=[[],[],[],[]];t.busy=[null,null,null,null];t.busyBy=null;});ents.forEach(e=>{if(e.state==='toClean'||e.state==='cleaning'){if(e.cleanTb)e.cleanTb.cleaner=null;goHome(e);}});orders=[];save();
}
function nextDay(){if(S.closing!==2)return;setTimeout(()=>{const k={7:'letter2',15:'pro_visit',22:'letter3'}[S.day];if(k)playScene(k);},600);document.getElementById('day').classList.remove('show');dayCardT=0;
  S.day++;S.clock=600;S.closing=0;S.dayEarn=0;S.dayVisits=0;spawnT=2;save();toast(S.day+'日目、開店です');}
document.getElementById('nextDay').onclick=nextDay;

// ---------- update ----------
function update(dt){
  gt+=dt;playTime+=dt;updateOutside(dt);
  // チュートリアル中は時間を止める:時計・半荘は進まず(卓はタップした分だけ進む)、お金も操作しないと増えない
  const tutOn=S.tut>0;if(tutOn)S.boostUntil=Date.now()+90000; // 開店記念の客足2倍はチュートリアル後から数える
  if(S.stage===0&&!S.drink&&S.money>=pr(250))playScene('drink_hint');
  if(S.stage===1&&S.storeEarn>=ST().goal.earn*.25)playScene('pro_meet');
  const bg=tutOn?0:bgIncome();if(bg>0){chainAcc+=bg*dt;if(chainAcc>=1){const v=Math.floor(chainAcc);chainAcc-=v;S.money+=v;S.total+=v;}}
  checkGoal();
  if(S.closing===2){if(dayCardT>0){dayCardT-=dt;document.getElementById('dayCount').textContent=Math.ceil(Math.max(0,dayCardT))+'秒後に自動で次の日へ進みます';if(dayCardT<=0)nextDay();}}
  else if(!S.closing){if(!tutOn)S.clock+=dt*MINPS;if(S.clock>=1440){S.clock=1440;S.closing=1;closeT=0;toast('閉店時間です。いまの半荘で終わりにします');}}
  else closing(dt);
  // 待合室から卓へ
  ents.filter(e=>e.state==='waiting').sort((a,b)=>a.waitOrder-b.waitOrder).forEach(e=>{
    const tb=openTable(e);if(tb)sendToSeat(e,tb,freeIdx(tb));
    else if(!tutOn&&gt-e.sitSince>patience()+custPat(e)-40){addRep(-.05);leave(e,'…');}});
  if(S.tut===1&&spawnT>1)spawnT=1; // チュートリアルの最初は、半荘が早く始まるようにお客さんを早めに呼ぶ
  const tutHold=tutOn&&(S.tut>1||tables.some(t=>t.state==='play')); // 最初の半荘が始まったら、チュートリアル中は新しい客を呼ばない
  if(!S.closing&&!tutHold){spawnT-=dt;if(spawnT<=0){spawn();spawnT=interval()*(0.7+Math.random()*0.6);}}
  ents.forEach(e=>{move(e,dt);if(e.bubbleT>0)e.bubbleT-=dt;});
  // プロ
  const pro=ents.find(e=>e.type==='pro');
  if(pro){
    if(!proOn()&&pro.state!=='leaving'&&!(pro.table&&pro.table.state==='play'))leave(pro,'またね');
    else if(pro.state==='standby'){const tb=openTable(null);if(tb)sendToSeat(pro,tb,freeIdx(tb));}
  }
  tables.forEach(tb=>{
    const T=TIERS[tierOf(tb)];
    if(tb.broken){if(Math.random()<dt*3)parts.push({x:SLOTS[tb.slot].x+rnd(-10,10),y:SLOTS[tb.slot].y,vx:rnd(-6,6),vy:-18,life:1.2,max:1.4,c:'rgba(160,160,160,.6)',s:4});return;}
    if(tb.state==='play'){if(!tutOn)tb.t+=dt;
      if(tb.t>=(tb.dur||T.dur))endGame(tb);return;}
    const oc=tb.seats.map(byId).filter(Boolean);
    const custs=oc.filter(e=>e.type==='cust');
    if(oc.length===4&&oc.every(e=>e.state==='seated')){startGame(tb);return;}
    if(!custs.length){oc.forEach(e=>{if(isCrew(e)&&e.state!=='returning')goHome(e);});return;}
    if(S.modes[tb.slot]==='set')return;
    custs.forEach(e=>{if(!tutOn&&e.state==='seated'&&gt-e.sitSince>custPat(e)){addRep(-.05);leave(e,'…');}});
    // メンバーは、お客さん(プロを含む)が3人席に着いてから4人目として入る
    if(oc.length<4&&oc.filter(e=>!isCrew(e)&&e.state==='seated').length>=3&&!oc.some(isCrew)){
      const st=ents.find(e=>e.type==='staff'&&e.state==='idle'&&!e.st.quitting)||ents.find(e=>e.type==='boss'&&e.state==='idle');
      if(st){const k=freeIdx(tb);if(k>=0){sendToSeat(st,tb,k);tb.waitSince=gt-2;}}
    }
  });
  // 休憩:休憩室で体力を回復し、満タンになったら持ち場に戻る(約20秒)。待機中も休憩室の1/5の速さで少しずつ回復する
  ents.forEach(e=>{if(!e.st)return;if(e.st.stam==null)e.st.stam=stamMax(e.st);
    if(e.state==='resting'){e.st.stam=Math.min(stamMax(e.st),e.st.stam+stamMax(e.st)/20*dt);
      if(e.st.stam>=stamMax(e.st)){e.restSpot=null;gainXp(e,'sta',3);
        if(e.type==='hall'){e.state='returning';route(e,HALLHOME.x,HALLHOME.y,HOMEY);}else{e.state='returning';const h=home(e.idx);route(e,h.x,h.y,HOMEY);}}}
    else if(e.state==='idle'){if(tired(e))goRest(e);else e.st.stam=Math.min(stamMax(e.st),e.st.stam+stamMax(e.st)/100*dt);}});
  // 退職予約の実行
  ents.filter(e=>e.st&&e.st.quitting).forEach(e=>{
    if(e.state==='idle'){const role=e.type==='hall'?'hall':'member';doDismiss({m:e.st,role});}else releaseIfWaiting(e);});
  // 注文の提供(ホールスタッフと、卓に入っていないメンバー)
  ents.filter(e=>e.type==='hall').concat(ents.filter(e=>e.type==='staff'),ents.filter(e=>e.type==='boss')).forEach(e=>{
    if(e.type==='boss'&&e.state==='idle'&&e.job){if(e.job.k==='drink'){e.state='prep';e.timer=0.5*cookMul(e);}else{e.state='toKitchen';route(e,KIT.x-36,KIT.y,KIT.corr);}}
    else if(e.state==='idle'&&S.closing!==2&&!e.st.quitting){
      while(orders.length){const o=orders.shift();if(canServe(byId(o.id),o)){e.job=o;break;}}
      if(!e.job){ // 注文がなければ、帰った客のサイドテーブルを片づける
        for(const tb of tables){if(tb.busyBy)continue;const k=[0,1,2,3].find(k=>tb.seats[k]===null&&tb.side[k].length);
          if(k!==undefined){tb.busyBy=e.id;e.bus={tb,k};e.state='toBus';const p=seatPos(tb,k),q=sidePos(tb,k);route(e,q.x,p.corr,p.corr);break;}}}
      if(e.job){if(e.job.k==='drink'){e.state='prep';e.timer=0.5*cookMul(e);}else{e.state='toKitchen';route(e,KIT.x+(e.type==='hall'?0:-18),KIT.y,KIT.corr);}}
    }else if(e.state==='busing'){e.timer-=dt;
      // その卓の、客が帰った席のサイドテーブルをまとめて片づける(座っている客の器は残す)
      if(e.timer<=0){const {tb}=e.bus;let n=0;[0,1,2,3].forEach(k=>{if(tb.seats[k]===null&&tb.side[k].length){n+=tb.side[k].length;tb.side[k]=[];const q=sidePos(tb,k);burst(q.x,q.y,6,['#ffffff','#bff4ff']);}});
        e.carry=n?['x']:null;tb.busyBy=null;e.bus=null;useStam(e,1);serverHome(e);}
    }else if(e.state==='prep'||e.state==='cook'){
      e.timer-=dt;
      if(e.state==='cook'&&Math.random()<dt*8)parts.push({x:e.x+rnd(-6,6),y:KIT.y+24,vx:rnd(-4,4),vy:-22,life:1,max:1.2,c:'rgba(255,255,255,.7)',s:3});
      if(e.timer<=0){gainXp(e,'cook',e.state==='cook'?2:1);if(e.state==='cook')useStam(e,1);const c=byId(e.job.id);
        if(canServe(c,e.job)){e.state='deliver';const p=seatPos(c.table,c.seat);route(e,p.x,p.corr,p.corr);}
        else serverHome(e);}
    }
  });
  // 立ち番の掃除と修理業者
  ents.forEach(e=>{
    if(isCrew(e)&&e.state==='idle'&&!S.closing&&!e.st.quitting){
      const tb=tables.filter(t=>t.dirt>=.35&&t.state!=='play'&&!t.cleaner).sort((a,b)=>b.dirt-a.dirt)[0];
      if(tb){tb.cleaner=e.id;e.cleanTb=tb;e.state='toClean';const s=SLOTS[tb.slot];route(e,s.x+22,s.y-50,s.y-50);}}
    if(e.state==='cleaning'){e.timer-=dt;const tb=e.cleanTb,s=SLOTS[tb.slot];
      if(Math.random()<dt*10)parts.push({x:s.x+rnd(-20,20),y:s.y+rnd(-20,20),vx:0,vy:-10,life:.5,max:.6,c:'#ffffff',s:2});
      if(tb.state==='play'){tb.cleaner=null;goHome(e);}
      else if(e.timer<=0){tb.dirt=0;tb.cleaner=null;S.cleans++;useStam(e,1);burst(s.x,s.y,10,['#bff4ff','#ffffff']);goHome(e);}}
    if(e.type==='tech'&&e.state==='repairing'){e.timer-=dt;const s=SLOTS[e.tb.slot];
      if(Math.random()<dt*6)burst(s.x+rnd(-12,12),s.y+rnd(-12,12),2,['#ffe27a','#ffffff']);
      if(e.timer<=0){fixTable(e.tb);leave(e);}}
  });
  if(dg('speaker')){noteT-=dt;if(noteT<=0){noteT=1.6/dg('speaker');const sp=[[16,158],[W-18,372],[16,308],[W-18,158]].slice(0,dg('speaker')>=3?4:2);const p=pick(sp);floats.push({x:p[0],y:p[1],text:'♪',t:0,c:'#ffffff',small:1});}}
  floats.forEach(f=>f.t+=dt);floats=floats.filter(f=>f.t<1.4);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+30*dt;p.life-=dt;});parts=parts.filter(p=>p.life>0);
  if(shake>0)shake-=dt;
  if(bonusT>0){bonusT-=dt;if(bonusT<=0)document.getElementById('bonus').style.display='none';}
}

const bossFree=()=>{const b=ents.find(e=>e.type==='boss');return b&&(b.state==='idle'||b.state==='returning')?b:null;};
function bossCmd(x,y){const b=ents.find(e=>e.type==='boss');if(!b)return false;
  // 1) 注文を待っているお客さん → 店長が用意して運ぶ
  const c=ents.find(e=>e.type==='cust'&&e.state==='seated'&&(e.orders||[]).length&&Math.hypot(e.x-x,e.y-y)<15);
  if(c){const o=c.orders.find(o=>orders.includes(o));if(!o){toast('もうスタッフが用意しています');return true;}
    if(!bossFree()){toast('店長はいま手が離せません');return true;}orders.splice(orders.indexOf(o),1);b.path=[];b.moving=false;b.job=o;b.state='idle';toast('店長が用意して運びます');return true;}
  // 2) 器が残ったサイドテーブル → 店長が卓ごと片づける
  for(const tb of tables)for(let k=0;k<4;k++){const q=sidePos(tb,k);if(Math.hypot(q.x-x,q.y-y)<11&&tb.seats[k]===null&&tb.side[k].length){
    if(tb.busyBy){toast('もうスタッフが片づけに向かっています');return true;}
    if(!bossFree()){toast('店長はいま手が離せません');return true;}
    tb.busyBy=b.id;b.bus={tb,k};b.state='toBus';const p=seatPos(tb,k);route(b,q.x,p.corr,p.corr);toast('店長が片づけます');return true;}}
  // 3) 卓 → 3人待っていれば店長が入って打つ、汚れていれば掃除する
  for(const tb of tables){const s=SLOTS[tb.slot];if(Math.hypot(x-s.x,y-s.y)>=38||tb.broken||tb.state==='play')continue;
    const oc=tb.seats.map(byId).filter(Boolean),k=freeIdx(tb);
    if(S.modes[tb.slot]==='free'&&k>=0&&oc.filter(e=>!isCrew(e)&&e.state==='seated').length>=3&&!oc.some(isCrew)){
      if(!bossFree()){toast('店長はいま手が離せません');return true;}sendToSeat(b,tb,k);toast('店長が入って打ちます');return true;}
    if(tb.dirt>=.2&&!tb.cleaner){if(!bossFree()){toast('店長はいま手が離せません');return true;}
      tb.cleaner=b.id;b.cleanTb=tb;b.state='toClean';route(b,s.x-22,s.y-50,s.y-50);toast('店長が掃除します');return true;}}
  return false;}

    body=`<h3>${g.no}号店 ${g.area}</h3><div class="mp-sub">${i===0?'ここから雀荘経営が始まります':'新しい店に持っていけるのは所持金だけです。スタッフと常連は今の店に残ります'}</div>${info}`+
      `<button class="mbtn pri" id="mpGo" ${short?'disabled':''}>${i===0?'ここで開業する':short?`あと ¥${fmt(g.open-S.money)} 貯めると出店できます`:'出店費用を払って出店する'}</button>`;}
  else{const prev=STAGES[i-1];body=`<h3>${g.no}号店 ???</h3><div class="mp-sub">${prev?`${prev.no}号店(${prev.area})の目標を達成して出店すると、次の街が選べるようになります`:''}</div>`;}
  P.innerHTML=body;const b=document.getElementById('mpGo');if(!b)return;
  b.onclick=()=>{if(st==='open'){closeMap();if(i!==S.active)switchShop(i);}
    else if(st==='next'){if(i===0){closeMap();askBossName(()=>{S.started=1;S.opened=0;save();setPre();prepareOpening();},true);return;document.getElementById('goal')._k=null;}
      else if(S.money>=g.open){closeMap();newStore();}}};}
// ---------- ストーリー「日本中に、ひだまりを」 ----------
// 話し手: boss=店長 tanaka=田中さん letter=祖父の手紙 rival=雀王グループの若社長 pro=麻雀プロ staff=スタッフ narr=ナレーション
const SPK={boss:()=>bossLabel(),tanaka:()=>'田中さん',letter:()=>'祖父の手紙',rival:()=>'雀王グループ 若社長',pro:()=>'御影ミコト(麻雀プロ)',staff:()=>(S.members[0]||{}).name||'スタッフ',narr:()=>''};

  ch0_intro:[['narr','久しぶりに開けた店は、ほこりをかぶっていた。'],
    ['staff','掃除、終わりました! 卓もちゃんと動きます。'],

  drink_hint:[['tanaka','打ってると喉が渇くねえ。お茶の一杯でも出てくると、みんな長居するんだが。'],
    ['narr','設備タブの「ドリンク」で、お客さんの注文を受けられるようになります。']],
  first_yakuman:[['tanaka','役満だ! 店中が沸いてるよ。こういう日があるから、麻雀はやめられないねえ。']],
  first_break:[['staff','店長、卓が止まっちゃいました!'],['boss','故障した卓をタップして、修理を呼ぼう。急ぐときは手積みでしのげる。']],
  first_rest:[['staff','すみません、少し休憩室で休んできます……!'],['narr','スタッフは仕事のたびにスタミナを使い、0になると休憩します。人手に余裕を持たせましょう。']],
  ch0_end:[['tanaka','昔の顔ぶれが、みんな戻ってきたねえ。じいさんも、きっと喜んでるよ。'],
    ['boss','田中さんのおかげです。'],
    ['tanaka','ところで、隣の街の駅前に「雀王グループ」って大きな店ができたらしい。若い連中は、みんなそっちへ行っちまうそうだ。'],
    ['boss','……行ってみます。ひだまりを、次の街にも。'],
    ['narr','全国マップから、2号店を出す街を選べるようになりました。']],
  ch1_intro:[['rival','へえ。商店街の小さな雀荘が、駅前に進出? 雀王グループの隣に店を出すなんて、いい度胸だ。'],
    ['rival','うちは卓もスタッフも最新鋭。名前も知らない客を、効率よく回すのが商売さ。'],
    ['boss','うちは、お客さんの名前を覚える店にします。']],
  pro_meet:[['pro','ここ、いいお店ね。駅前の大きな店より、ずっと落ち着く。'],
    ['pro','私、麻雀プロの御影ミコト。近くで対局がある日は、寄らせてもらってもいい?'],
    ['boss','ぜひ! お客さんも喜びます。'],
    ['narr','画面右上の「プロを呼ぶ」で、ミコトさんが来店し、しばらく客足が2倍になります。']],
  ch1_end:[['rival','……うちの客が、そっちに流れてる。設備はうちの方が上なのに、なぜだ?'],
    ['boss','名前で呼ばれると、また来たくなるんだと思います。'],
    ['rival','フン。福岡では、そうはいかないぞ。'],
    ['narr','3号店を出す街を選べるようになりました。']],
  ch2_intro:[['staff','福岡は、学生さんや若いお客さんが多いですね! 屋台帰りのお客さんも。'],
    ['boss','店が大きくなる。みんなが自分で考えて動けるように、スタッフを育てていこう。'],
    ['narr','スタッフは働くほど経験を積んで成長します。研修で伸ばすこともできます。']],
  letter2:[['letter','店が増えると、目の届かない場所も増える。でも、任せられる仲間がいれば大丈夫だ。'],
    ['letter','人を信じて任せることも、店長の大事な仕事だよ。']],
  ch2_end:[['staff','店長! 今日は、私たちだけでお店を回せました!'],
    ['boss','すごいよ。みんな、ありがとう。'],
    ['rival','……大阪で待ってる。話がある。'],
    ['narr','4号店を出す街を選べるようになりました。']],
  ch3_intro:[['rival','単刀直入に言う。ひだまりを、チェーンごと雀王グループに売ってくれないか。悪い額じゃない。'],

  ch3_end:[['narr','1号店の田中さんから、電話がかかってきた。'],
    ['tanaka','大阪も大繁盛だってねえ。次は東京かい。じいさんの夢まで、あと一歩だ。'],
    ['narr','最後の街、東京を選べるようになりました。']],
  ch4_intro:[['boss','新宿。じいちゃんが、一番店を出したがっていた街だ。'],
    ['staff','卓が16台も! 忙しくなりますね。'],
    ['rival','ここは雀王グループの本拠地だ。ひだまりのやり方が通用するか、見せてもらう。']],
  letter3:[['letter','日本中にひだまりを、なんて大きな夢を書いたが……本当は、一つでよかったのかもしれない。'],
    ['letter','誰かにとっての「帰ってくる場所」になれたなら。それで十分だ。']],
  finale:[['rival','……今日、客として来てみた。気づいたら、隣の卓の知らない客と、笑って話していた。'],
    ['rival','数字では測れないものがある。……ひだまりの勝ちだ。'],
    ['tanaka','おーい、{boss}! みんなで来たよ!'],
    ['narr','1号店の常連たち、各地の常連たち、スタッフ、そしてミコトさん。新宿の店に、みんながそろった。'],
    ['boss','じいちゃん。日本中に、ひだまりができたよ。'],
    ['narr','― 日本中に、ひだまりを ―  おしまい。'],
    ['narr','ここからも、店の経営はずっと続きます。']]
};
// ドット絵の顔アイコン(16×16)
const FACES={};
function makeFace(k){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');if(!g)return'';
  const P=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  const bg={boss:'#e9dcc0',tanaka:'#dfe7d6',rival:'#d9dde8',pro:'#f0dbe2',staff:'#dbe9e6',letter:'#f3ead3'}[k]||'#ddd';P(0,0,16,16,bg);
  if(k==='letter'){P(2,4,12,9,'#fbf6e8');P(2,4,12,1,'#b8a888');P(2,12,12,1,'#b8a888');P(2,4,1,9,'#b8a888');P(13,4,1,9,'#b8a888');
    for(let i=0;i<6;i++){P(3+i,5+i*0.9|0,1,1,'#b8a888');P(12-i,5+i*0.9|0,1,1,'#b8a888');}P(7,9,2,2,'#c0392b');return c.toDataURL();}
  const hair={boss:'#1a1a1a',tanaka:'#d8d8d8',rival:'#3a2a1a',pro:'#2b2118',staff:'#5a3a22'}[k],cloth={boss:'#232838',tanaka:'#6d5a8a',rival:'#eeeeee',pro:'#7a1f2e',staff:'#f3f3f3'}[k];
  if(k==='pro'){P(3,3,10,11,hair);}
  P(2,13,12,3,cloth);if(k==='staff'){P(6,13,4,3,'#1c1c1c');}if(k==='boss'){P(7,13,2,3,'#c8a04a');}if(k==='rival'){P(7,13,2,3,'#1a1a1a');}
  P(4,4,8,9,'#f0c8a0');P(5,12,6,1,'#e2b48c');
  if(k==='tanaka'){P(4,3,8,2,hair);P(3,4,1,4,hair);P(12,4,1,4,hair);P(5,7,2,1,'#7a7a7a');P(9,7,2,1,'#7a7a7a');}
  else if(k==='rival'){P(4,2,8,3,hair);P(4,5,1,2,hair);P(11,3,2,2,hair);}
  else if(k==='pro'){P(4,2,8,3,hair);P(3,4,1,8,hair);P(12,4,1,8,hair);P(11,3,2,1,'#ffd35a');}
  else{P(4,2,8,3,hair);P(3,3,1,4,hair);P(12,3,1,4,hair);}
  P(5,8,2,1,'#2a1a10');P(9,8,2,1,'#2a1a10');P(7,11,2,1,k==='rival'?'#8a4a3a':'#c0605a');
  if(k==='tanaka'){P(4,10,1,1,'#e2a08c');P(11,10,1,1,'#e2a08c');}
  return c.toDataURL();}
let storyQ=[],storyCur=null;
const storyOpen=()=>!!storyCur;
function fillText(t){return t.replace(/\{boss\}/g,bossLabel()).replace(/\{shop\}/g,shopName());}
// チュートリアル中はヒントの会話を出さない(既読にしないので、終わったあと同じ状況になれば出る)
const TUT_HOLD=['drink_hint','first_yakuman','first_break','first_rest'];
function playScene(id,onDone,force){S.story=S.story||{};if(!STORY[id]||(S.story[id]&&!force)||(S.tut>0&&TUT_HOLD.includes(id))){onDone&&onDone();return;}
  S.story[id]=1;save();storyQ.push({id,i:0,onDone});if(!storyCur)nextScene();}
function nextScene(){storyCur=storyQ.shift()||null;setPre();document.body.classList.toggle('story',!!storyCur);const box=document.getElementById('story');if(!storyCur){box.classList.remove('show');return;}box.classList.add('show');showLine();}
function showLine(){const [k,t]=STORY[storyCur.id][storyCur.i],face=document.getElementById('stFace');
  if(k==='narr'){face.style.display='none';}else{face.style.display='';FACES[k]=FACES[k]||makeFace(k);face.src=FACES[k];}
  document.getElementById('stName').textContent=SPK[k]();document.getElementById('stName').style.display=k==='narr'?'none':'';
  const tx=document.getElementById('stText');tx.textContent=fillText(t);tx.classList.toggle('narr',k==='narr');
  document.getElementById('stNext').textContent=storyCur.i<STORY[storyCur.id].length-1?'▼':'とじる';}
function advanceStory(){if(!storyCur)return;storyCur.i++;if(storyCur.i>=STORY[storyCur.id].length){const cb=storyCur.onDone;storyCur=null;nextScene();cb&&cb();}else showLine();}
function skipStory(){if(!storyCur)return;const cb=storyCur.onDone;storyCur=null;nextScene();cb&&cb();}
document.getElementById('story').onclick=ev=>{if(ev.target.id==='stSkip')return;advanceStory();};
document.getElementById('stSkip').onclick=skipStory;

// ---------- チュートリアル(1号店の開店後、田中さんの話が終わったら) ----------
// S.tut: 0=まだ 1〜=進行中のステップ -1=完了
let tutTap=0,tutBase=null;
const coachRing=document.getElementById('coachRing'),coachTip=document.getElementById('coachTip'),coachSkip=document.getElementById('coachSkip');
coachSkip.onclick=()=>{S.tut=-1;save();};
// 置いてある卓すべてを囲む枠(椅子・サイドテーブル・卓の札まで入れる)
function tablesRect(){if(!tables.length)return null;const xs=tables.map(t=>SLOTS[t.slot].x),ys=tables.map(t=>SLOTS[t.slot].y),m=64,r=cv.getBoundingClientRect();
  const x0=Math.min(...xs)-m,x1=Math.max(...xs)+m,y0=Math.min(...ys)-m-6,y1=Math.max(...ys)+m;
  return{left:r.left+x0*scale,top:r.top+y0*scale,width:(x1-x0)*scale,height:(y1-y0)*scale};}
function canvasRect(x,y,half){const r=cv.getBoundingClientRect(),h=Math.max(half*scale,22);return{left:r.left+x*scale-h,top:r.top+y*scale-h,width:h*2,height:h*2};}
// 下部パネルの項目:タブが違うか閉じていればタブのボタンを、開いていれば購入ボタンを示す
function tabEl(t,key){const nb=document.querySelector(`nav button[data-tab="${t}"]`);if(tab!==t||sheetEl.classList.contains('collapsed'))return nb;
  const r=rows.find(r=>r.u&&(r.u===key||r.u.key===key));if(!r)return nb;if(!r.btn._sv){r.btn._sv=1;r.btn.scrollIntoView({block:'nearest'});}return r.btn;}
const TUT=[
  {t:'卓に4人そろうと半荘が始まります。お客さんが3人のときは、メンバーが4人目に入ります。まずは様子を見てみましょう。',
    rect:tablesRect,tipTop:1,done:()=>tables.some(t=>t.state==='play')||S.games>0},
  {t:'チュートリアル中は時間が止まっています。対局中の卓をタップすると、半荘が少し早く進みます。3回タップしてみましょう。',
    rect:()=>{const tb=tables.find(t=>t.state==='play');return tb&&canvasRect(SLOTS[tb.slot].x,SLOTS[tb.slot].y,46);},done:()=>tutTap>=3},
  {t:'「卓」タブの「場代」を上げると、半荘ごとの収入が増えます。1回上げてみましょう。',
    el:()=>tabEl('table',ROW.fee),tipTop:1,done:()=>S.fee>tutBase.fee},
  {t:'「内装」タブで観葉植物を置くと、お客さんの来るペースが上がります。',
    el:()=>tabEl('deco','deco:plant'),tipTop:1,done:()=>S.deco.plant>tutBase.plant},
  {t:'黄色い輪の人があなた(店長)です。注文の出ているお客さんや汚れた卓をタップすると、店長がその仕事を優先します。',
    rect:()=>{const b=ents.find(e=>e.type==='boss');return b&&canvasRect(b.x,b.y,18);},next:1},
  {t:'画面上の目標(売上と評判)を達成すると、次の街に2号店を出せます。場代や内装を少しずつ上げて、お店を育てていきましょう!',
    el:()=>document.getElementById('goal'),next:1}
];
function tutNext(){S.tut++;tutBase=null;tutTap=0;coachTip._s=null;if(S.tut>TUT.length){S.tut=-1;toast('チュートリアル完了! いい店にしていきましょう');}save();}
function tutUpdate(){
  if(S.tut===0&&S.stage===0&&S.opened&&(S.story||{}).ch0_open&&!storyOpen()){S.tut=1;save();}
  const on=S.tut>0&&S.opened&&!storyOpen()&&S.closing!==2&&!modal.classList.contains('show')&&!document.getElementById('map').classList.contains('show');
  document.body.classList.toggle('tut',on);
  if(!on){coachRing.style.display=coachTip.style.display=coachSkip.style.display='none';return;}
  coachSkip.style.display='block';
  const st=TUT[S.tut-1];if(!st){S.tut=-1;save();return;}
  if(!tutBase)tutBase={fee:S.fee,plant:S.deco.plant};
  if(st.done&&st.done()){tutNext();return;}
  if(coachTip._s!==S.tut){coachTip._s=S.tut;
    coachTip.innerHTML=`<div class="ct-h">チュートリアル ${S.tut}/${TUT.length}</div><div>${st.t}</div><div class="ct-b">${st.next?'<button type="button" class="ct-next">次へ</button>':''}</div>`;
    const nx=coachTip.querySelector('.ct-next');if(nx)nx.onclick=tutNext;}
  let r=null;if(st.rect)r=st.rect();else if(st.el){const e=st.el();if(e&&e.offsetParent)r=e.getBoundingClientRect();}
  coachTip.style.display='block';const vh=window.innerHeight;
  // tipTopのステップは吹き出しを画面上部に固定する(枠がタブから購入ボタンへ移っても動かさない)
  if(r){const p=4;Object.assign(coachRing.style,{display:'block',left:r.left-p+'px',top:r.top-p+'px',width:r.width+p*2+'px',height:r.height+p*2+'px'});
    if(st.tipTop){coachTip.style.bottom='';coachTip.style.top='calc(60px + env(safe-area-inset-top,0px))';}
    else if(r.top+r.height/2>vh*.5){coachTip.style.top='';coachTip.style.bottom=Math.min(vh-120,vh-r.top+14)+'px';}
    else{coachTip.style.bottom='';coachTip.style.top=Math.min(vh-160,r.top+r.height+14)+'px';}}
  else{coachRing.style.display='none';coachTip.style.bottom='';coachTip.style.top='18%';}
}

// ---------- loop ----------
let last=performance.now(),acc=0;
function loop(t){const dt=Math.max(0,Math.min((t-last)/1000,.1));last=t;if(S.started&&S.opened&&!storyOpen())update(dt);else{gt+=dt;updateOutside(dt);}tables.forEach(tb=>{if(tb.tap>0)tb.tap-=dt*3;});
  if(S.started)draw();tutUpdate();document.getElementById('money').textContent='¥'+fmt(S.money);drawTimebar();
  acc+=dt;if(acc>.25){acc=0;refresh();}requestAnimationFrame(loop);}
{const iv=document.getElementById('intro');for(let i=0;i<14;i++){const p=document.createElement('i');p.className='petal';
  p.style.cssText=`left:${Math.random()*110}%;animation-duration:${7+Math.random()*6}s;animation-delay:${-Math.random()*12}s;width:${7+Math.random()*6}px;height:${6+Math.random()*4}px`;iv.appendChild(p);}
  document.getElementById('inGo').onclick=()=>{if(!S.started&&!storyOpen())openMap('start');};}
setPre();applyLayout();initWorld();fit();renderTab();if(S.started&&S.opened)offline(S.last);else if(S.started)prepareOpening();else playScene('prologue',()=>openMap('start'));if(S.closing===2){S.closing=1;closeT=0;}
setInterval(save,5000);
requestAnimationFrame(loop);
})();
